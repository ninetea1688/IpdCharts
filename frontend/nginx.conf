server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — ทุก route ส่ง index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy ไปยัง backend
    #
    # ต้องใช้ชื่อคอนเทนเนอร์เต็ม "ipdcharts-backend" ไม่ใช่ชื่อ service สั้นๆ ว่า "backend"
    # เพราะบน prod คอนเทนเนอร์นี้ต่ออยู่กับ network ร่วมของ Kong ที่มีโปรเจคอื่นอยู่ด้วย
    # และมีคอนเทนเนอร์ชื่อ "backend" ของโปรเจคอื่นอยู่แล้ว — DNS จะ resolve ไปผิดตัว
    #
    # resolver + ตัวแปรใน proxy_pass บังคับให้ nginx resolve ใหม่เป็นระยะ
    # ไม่ใช่ cache IP ไว้ตั้งแต่ตอน start (backend ที่ restart แล้วได้ IP ใหม่จะ 502 ค้าง)
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $ipd_api http://ipdcharts-backend:3000;
        proxy_pass $ipd_api$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
